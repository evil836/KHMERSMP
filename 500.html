<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | NOKOR-MC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Press Start 2P', 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .error-container { text-align: center; padding: 40px 20px; }
        .error-code { font-size: 100px; color: #e74c3c; text-shadow: 6px 6px 0 #c0392b; margin-bottom: 20px; }
        .error-message { font-size: 16px; margin-bottom: 30px; color: #e74c3c; }
        .error-description { font-size: 12px; margin-bottom: 40px; line-height: 1.8; }
        .home-btn { display: inline-block; background-color: #9C002F; color: white; text-decoration: none; padding: 15px 30px; border-radius: 50px; font-size: 12px; transition: 0.3s; }
        .home-btn:hover { background-color: #E61E4D; transform: translateY(-3px); }
        @media (max-width: 768px) { .error-code { font-size: 70px; } .error-message { font-size: 12px; } }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="error-container">
        <div class="error-code">500</div>
        <div class="error-message">INTERNAL SERVER ERROR</div>
        <div class="error-description">Something went wrong on our end.<br>Please try again later or contact support.</div>
        <a href="/" class="home-btn">← BACK TO HOME</a>
    </div>
</body>
</html>
